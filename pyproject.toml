[project]
name = "shortforge"
version = "0.1.0"
description = "Batch generator of unique variants of short vertical videos for TikTok, YouTube Shorts and Reels"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
