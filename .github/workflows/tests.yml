name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # End-to-end encoding tests need ffmpeg with libass and drawtext; the
      # Ubuntu package has both. On macOS and Windows those tests are skipped.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The repository is not an installable package (flat layout), so the
      # dependencies from pyproject.toml are installed directly.
      - name: Install dependencies
        run: python -m pip install "psutil>=5.9" "pytest>=8"
      - name: Run tests
        run: python -m pytest -q -rs
